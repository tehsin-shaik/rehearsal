<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rehearsal</title><link rel="stylesheet" href="popup.css"></head><body><header><img class="logo" src="rehearsal-logo.png" alt="Rehearsal logo" width="68" height="68"><div><h1>Rehearsal</h1><p>Observe · Learn · Automate</p></div></header><p class="notice">Only supported semantic metadata. No copied bodies, keys, passwords, or coordinates.</p><form id="setup"><label>API origin<input id="endpoint" type="url" value="http://localhost:3000" required></label><label>Temporary observation token<input id="token" type="password" autocomplete="off" placeholder="Paste from Integrations"></label><label class="toggle"><input id="enabled" type="checkbox">Enable observation</label><button type="submit">Save & pair</button></form><p id="status" role="status">Not paired</p><p class="id">Extension ID: <code id="extension-id"></code></p><div class="actions"><button id="finish" type="button">Finish observation</button><button id="retry" type="button">Retry delivery</button></div><h2>Recent semantic events</h2><ul id="events"></ul><button class="clear" id="clear" type="button">Clear metadata & unpair</button><script src="popup.js" type="module"></script></body></html>
