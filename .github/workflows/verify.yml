name: Verify Rehearsal
on:
  push:
    branches: [main, feature/rehearsal-complete]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DEMO_MODE: 'true'
      NEXT_PUBLIC_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Refresh exact dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Format source and export verification checkpoint
        run: |
          npx prettier --write src tests extension scripts docs *.json *.ts *.mjs .github/workflows/*.yml
          node scripts/export-ci-checkpoint.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install browser verification tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify real browser flow
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/rehearsal-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/workspace > /dev/null && break; sleep 1; done
          node scripts/verify-browser.mjs
        env:
          REHEARSAL_PRINT_SCREENSHOT: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehearsal-browser-checks
          path: test-results/
          if-no-files-found: ignore
